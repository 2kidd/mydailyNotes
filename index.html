<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <title>Notes of Reverse</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="日常杂记与胡思乱想">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" title="docsify-darklight-theme" type="text/css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.css">
  
  <style>
    /* 看板娘样式 - 保持你原来的坐标设置 */
    #custom-mascot {
      position: fixed;
      right: 10px;
      bottom: 200px;         /* 电脑端距离底部 200px */
      z-index: 99;
      pointer-events: none;  /* 鼠标穿透 */
      opacity: 0.8;
      transition: opacity 0.3s;
    }
    #custom-mascot:hover { opacity: 1; }
    #custom-mascot img { width: 150px; height: auto; }

    @media (max-width: 768px) {
      #custom-mascot {
        display: block;  
        right: 0;
        bottom: 300px;       /* 移动端距离底部 300px */
      }
      #custom-mascot img { width: 80px; opacity: 0.5; }
    }
    
    /* 看板娘起伏动画 */
    @keyframes hover {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }
    #custom-mascot img { animation: hover 2s ease-in-out infinite; }

    /* 优化公式显示 */
    .katex-display { overflow-x: auto; overflow-y: hidden; }
  </style>
</head>

<body>
  <div id="app">加载中...</div>

  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

  <script>
    var num = 0;
    mermaid.initialize({ startOnLoad: false });

    window.$docsify = {
      name: 'Reverse随记',
      loadSidebar: true, 
      subMaxLevel: 2,
      
      // 整合渲染逻辑：同时处理 Mermaid 和代码行号
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return '<div class="mermaid">' + mermaid.render('mermaid-svg-' + num++, code) + "</div>";
            }
            return this.origin.code.apply(this, arguments).replace('<pre', '<pre class="line-numbers"');
          }
        }
      },

      // 暗黑模式配置 - 已修复语法错误
      darklightTheme: {
        siteFont: "PT Sans",
        defaultTheme: 'light',
        codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
        bodyFontSize: '15px',
        dark: {
          accent: '#42b983',
          toogleBackground: '#ffffff',
          background: '#091a28',
          textColor: '#b9b9b9',
        },
        light: {
          accent: '#42b983',
          toogleBackground: '#091a28',
          background: '#ffffff',
          textColor: '#34495e'
        }
      },
      
      alias: { '/.*/_sidebar.md': '/_sidebar.md' }
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>

  <div id="custom-mascot">
    <img src="assets/cutesister1.png" alt="看板娘">
  </div>
</body>
</html>
