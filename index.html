<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <title>Notes of Reverse</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="日常杂记与胡思乱想">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" title="docsify-darklight-theme" type="text/css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>
  
   <style>
  /* 电脑端样式 */
  #custom-mascot {
    position: fixed;
    right: 10px;       /* 距离右边距离 */
    bottom: 200px;         /* 距离底部距离 */
    z-index: 99;       /* 确保在最上层 */
    pointer-events: none; /* 鼠标可以穿透图片，不影响点后面的按钮 */
    opacity: 0.8;      /* 半透明，不遮挡视线 */
    transition: opacity 0.3s;
  }
  
  #custom-mascot:hover {
    opacity: 1;        /* 鼠标悬停时恢复清晰 */
  }

  #custom-mascot img {
    width: 150px;      /* 电脑端图片宽度，你可以根据图片比例调整 */
    height: auto;
  }

  /* 移动端（手机）适配逻辑 */
  @media (max-width: 768px) {
    #custom-mascot {
      /* 如果想在手机上显示，就把下面的 none 改成 block */
      display: block;  
      right: 0;
      bottom: 300px;
    }
    #custom-mascot img {
      width: 80px;     /* 手机端大幅缩小，避免挡住文字 */
      opacity: 0.5;    /* 手机端更透明一些 */
    }
  }
  
  @keyframes hover {
    0% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0); }
  }

  #custom-mascot img {
    animation: hover 2s ease-in-out infinite; /* 每3秒起伏一次 */
  }
  /* 让代码块也支持行号显示 */
   code[class*="language-"], pre[class*="language-"] {
     white-space: pre-wrap !important;
   }
</style>


</head>

<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: 'Reverse随记',
      // 侧边栏配置
      loadSidebar: true, 
      subMaxLevel: 2,
      
      // 亮色/暗色模式详细配置
      darklightTheme: {
        siteFont: "PT Sans",
        defaultTheme: 'light', // 默认主题：'dark' 或 'light'
        codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
        bodyFontSize: '15px',
        dark: {
          accent: '#42b983', // 暗色模式下的主题色
          toogleBackground: '#ffffff', // 切换按钮背景
          background: '#091a28', // 暗色模式背景
          textColor: '#b9b9b9',
        },
        light: {
          accent: '#42b983', // 亮色模式下的主题色
          toogleBackground: '#091a28',
          background: '#ffffff',
          textColor: '#34495e'
        }
      },
      
      // 解决子目录刷新 404 的别名配置
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      }

      // 开启代码行号配置
      markdown: {
        renderer: {
          code: function(code, lang) {
            return this.origin.code.apply(this, arguments).replace('<pre', '<			  pre class="line-numbers"');
          }
        }
      },
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js" type="text/javascript"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  
  <div id="custom-mascot">
    <img src="assets/cutesister1.png" alt="看板娘">
  </div>

  
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.css">
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
</body>
</html>
