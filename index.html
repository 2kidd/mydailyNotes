<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <title>Notes of Reverse</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="日常杂记与胡思乱想">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" title="docsify-darklight-theme" type="text/css">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.css">

  <style>
    /* 保持你原有的看板娘样式 [cite: 1] */
    #custom-mascot {
      position: fixed;
      right: 10px;       /* 距离右边距离 [cite: 2] */
      bottom: 200px;     /* 距离底部距离 [cite: 2] */
      z-index: 99;       /* 确保在最上层 [cite: 3] */
      pointer-events: none; /* 鼠标穿透图片 [cite: 3] */
      opacity: 0.8;      /* 半透明 [cite: 4] */
      transition: opacity 0.3s;
    }
    
    #custom-mascot:hover {
      opacity: 1;        /* 悬停恢复清晰 [cite: 5] */
    }

    #custom-mascot img {
      width: 150px;      /* 图片宽度 [cite: 6] */
      height: auto;
    }

    @media (max-width: 768px) {
      #custom-mascot {
        display: block;  /* 移动端显示  */
        right: 0;
        bottom: 300px;   /* 移动端底部距离  */
      }
      #custom-mascot img {
        width: 80px;     /* 移动端缩小图片 [cite: 8] */
        opacity: 0.5;    /* 移动端更透明 [cite: 9] */
      }
    }
    
    @keyframes hover {
      0% { transform: translateY(0); } [cite: 10]
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); } [cite: 11]
    }

    #custom-mascot img {
      animation: hover 2s ease-in-out infinite; /* 保持你设置的2秒起伏一次  */
    }

    /* 修正公式显示溢出问题 */
    .katex-display { overflow-x: auto; overflow-y: hidden; }
  </style>
</head>

<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: 'Reverse随记',
      loadSidebar: true, 
      subMaxLevel: 2,
      
      // 【新增】代码块渲染配置：强制开启行号
      markdown: {
        renderer: {
          code: function(code, lang) {
            return this.origin.code.apply(this, arguments).replace('<pre', '<pre class="line-numbers"');
          }
        }
      },
      
      darklightTheme: {
        siteFont: "PT Sans",
        defaultTheme: 'light', [cite: 13]
        codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
        bodyFontSize: '15px',
        dark: {
          accent: '#42b983',
          toogleBackground: '#ffffff',
          background: '#091a28',
          textColor: '#b9b9b9',
        },
        light: {
          accent: '#42b983',
          toogleBackground: '#091a28', [cite: 14]
          background: '#ffffff',
          textColor: '#34495e'
        }
      },
      
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      }
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js" type="text/javascript"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script> 
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
  
  <div id="custom-mascot">
    <img src="assets/cutesister1.png" alt="看板娘">
  </div>

</body>
</html>
