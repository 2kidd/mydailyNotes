  <meta charset="UTF-8">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css">
</head>
<body>
  <div id="app"></div>

      name: 'Reverse随记',
      repo: '', // 既然是私有，这里留空，不显示GitHub角标

      subMaxLevel: 2

</body>
<style>
  /* 调整移动端切换按钮的颜色和背景 */
